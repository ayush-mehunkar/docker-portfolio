<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayush's Portfolio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }
        .card {
            width: 100%;
            max-width: 620px;
            padding: 36px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
        }
        h1 { color: #60a5fa; margin-top: 0; }
        h2 { font-size: 1.25rem; }
        p { line-height: 1.7; color: #d1d5db; }
        .label { color: #93c5fd; font-weight: bold; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Hello, I'm Ayush!</h1>
        <h2>Welcome to My Portfolio</h2>
        <p>I am learning Docker and DevOps and building my skills in cloud technologies.</p>
        <p><span class="label">Skills:</span> Linux, HTML, Docker</p>
        <p><span class="label">Project:</span> My Docker Portfolio Website — a responsive portfolio website served using an Nginx Docker container.</p>
    </main>
</body>
</html>
